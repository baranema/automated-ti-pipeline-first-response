[defaults]
inventory = response/inventory.yml
host_key_checking = False
forks = 10
interpreter_python = /usr/bin/python3
deprecation_warnings = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/opt/automated-ti-pipeline/runtime/.ssh/known_hosts -o StrictHostKeyChecking=accept-new
